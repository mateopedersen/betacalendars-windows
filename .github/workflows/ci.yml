name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-cli:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build BetaCalendars.sln -c Release
      - run: dotnet format BetaCalendars.sln --verify-no-changes --no-restore
      - run: dotnet run --project tests/BetaCalendars.Tests -c Release --no-build
      - run: dotnet run --project src/BetaCalendars.Cli -c Release --no-build -- validate 2027
      - run: dotnet run --project src/BetaCalendars.Cli -c Release --no-build -- inspect 2027-01-01 --json
  windows-app:
    runs-on: windows-2022
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build BetaCalendars.sln -c Release
      - run: dotnet run --project tests/BetaCalendars.Tests -c Release
      - name: Publish GUI and CLI self-contained
        shell: pwsh
        run: |
          dotnet publish src/BetaCalendars.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish
          dotnet publish src/BetaCalendars.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/cli
          Copy-Item artifacts/cli/betacal.exe artifacts/publish/betacal.exe
      - name: Build MSI
        shell: pwsh
        run: dotnet build installer/wix/BetaCalendars.Installer.wixproj -c Release -p:PublishDir="$PWD/artifacts/publish"
      - name: Silent install, CLI smoke, uninstall, reinstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem installer/wix/bin/Release -Filter '*.msi' -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'MSI output missing' }
          Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait -PassThru | ForEach-Object { if ($_.ExitCode -notin 0,3010) { throw "Install failed: $($_.ExitCode)" } }
          $cli = Join-Path $env:ProgramFiles 'Beta Calendars Studio\betacal.exe'
          if (-not (Test-Path $cli)) { throw 'Installed CLI missing' }
          & $cli validate 2027
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke test failed' }
          $gui = Join-Path $env:ProgramFiles 'Beta Calendars Studio\BetaCalendarsStudio.exe'
          if (-not (Test-Path $gui)) { throw 'Installed desktop application missing' }
          $app = Start-Process $gui -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Desktop application exited during launch smoke test: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Start-Process msiexec.exe -ArgumentList @('/x', $msi.FullName, '/qn', '/norestart') -Wait -PassThru | ForEach-Object { if ($_.ExitCode -notin 0,3010) { throw "Uninstall failed: $($_.ExitCode)" } }
          if (Test-Path (Join-Path $env:ProgramFiles 'Beta Calendars Studio')) { throw 'Install directory still exists' }
          Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait -PassThru | ForEach-Object { if ($_.ExitCode -notin 0,3010) { throw "Reinstall failed: $($_.ExitCode)" } }
      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item (Get-ChildItem installer/wix/bin/Release -Filter '*.msi' -Recurse | Select-Object -First 1).FullName artifacts/release/BetaCalendarsStudio-1.0.0-win-x64.msi
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/release/BetaCalendarsStudio-1.0.0-win-x64.zip -Force
          Get-FileHash artifacts/release/BetaCalendarsStudio-1.0.0-win-x64.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  BetaCalendarsStudio-1.0.0-win-x64.msi" } | Set-Content artifacts/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: artifacts/release/*
