name: Release
on:
  push:
    tags: [v1.0.0]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build BetaCalendars.sln -c Release
          dotnet run --project tests/BetaCalendars.Tests -c Release
          dotnet publish src/BetaCalendars.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish
          dotnet publish src/BetaCalendars.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/cli
          Copy-Item artifacts/cli/betacal.exe artifacts/publish/betacal.exe
          dotnet build installer/wix/BetaCalendars.Installer.wixproj -c Release -p:PublishDir="$PWD/artifacts/publish"
      - name: Silent install, app launch, uninstall, and reinstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem installer/wix/bin -Filter '*.msi' -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'MSI output missing' }
          & msiexec.exe /i $msi.FullName /qn /norestart
          if ($LASTEXITCODE -notin 0,3010) { throw "Install failed: $LASTEXITCODE" }
          $cli = Join-Path $env:ProgramFiles 'Beta Calendars Studio\betacal.exe'
          if (-not (Test-Path $cli)) { throw 'Installed CLI missing' }
          & $cli validate 2027
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke test failed' }
          $gui = Join-Path $env:ProgramFiles 'Beta Calendars Studio\BetaCalendarsStudio.exe'
          if (-not (Test-Path $gui)) { throw 'Installed desktop application missing' }
          $app = Start-Process $gui -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Desktop application exited during launch smoke test: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          & msiexec.exe /x $msi.FullName /qn /norestart
          if ($LASTEXITCODE -notin 0,3010) { throw "Uninstall failed: $LASTEXITCODE" }
          if (Test-Path (Join-Path $env:ProgramFiles 'Beta Calendars Studio')) { throw 'Install directory still exists' }
          & msiexec.exe /i $msi.FullName /qn /norestart
          if ($LASTEXITCODE -notin 0,3010) { throw "Reinstall failed: $LASTEXITCODE" }
      - name: Create immutable release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item (Get-ChildItem installer/wix/bin -Filter '*.msi' -Recurse | Select-Object -First 1).FullName artifacts/release/BetaCalendarsStudio-1.0.0-win-x64.msi
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/release/BetaCalendarsStudio-1.0.0-win-x64.zip -Force
          Get-FileHash artifacts/release/BetaCalendarsStudio-1.0.0-win-x64.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  BetaCalendarsStudio-1.0.0-win-x64.msi" } | Set-Content artifacts/release/SHA256SUMS.txt
      - name: Scan release files with Microsoft Defender
        shell: pwsh
        run: |
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $scanner)) { throw 'Microsoft Defender command-line scanner is unavailable.' }
          $scanOutput = & $scanner -Scan -ScanType 3 -File "$PWD\artifacts\release" 2>&1
          $scanResult = $LASTEXITCODE
          $scanOutput | Set-Content artifacts/DefenderScan.txt
          "ExitCode: $scanResult" | Add-Content artifacts/DefenderScan.txt
          if ($scanResult -ne 0) { throw "Microsoft Defender scan returned $scanResult." }
      - uses: actions/upload-artifact@v6
        with:
          name: release-verification
          path: artifacts/DefenderScan.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME artifacts/release/* --title 'Beta Calendars Studio 1.0.0' --generate-notes
